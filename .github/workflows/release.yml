name: Release

# A version tag (v1.2.3, matching pythonic.__version__) builds the standalone
# app for each OS in two editions and publishes them as a GitHub Release.
# Run by hand (Actions > Release > Run workflow) it only builds: the
# downloads are the run's artifacts. See docs/releasing.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    name: AI models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Git LFS bandwidth is metered: the models come from the cache once fetched
      - name: List the LFS objects
        run: git lfs ls-files --long > .lfs-objects
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
      - name: Fetch the models
        run: git lfs pull --include "drum_cvae_best.pt,drum_patterns/pattern_cvae_best.pt"

      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: |
            drum_cvae_best.pt
            drum_patterns/pattern_cvae_best.pt
          retention-days: 1

  build:
    name: ${{ matrix.os }} ${{ matrix.edition }}
    needs: models
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported Ubuntu: the app then runs on
        # any distribution with the same glibc or newer
        os: [ubuntu-22.04, windows-latest, macos-latest]
        edition: [light, ai]
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python packaging/build.py --version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pythonic.__version__ $version"
            exit 1
          fi

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libportaudio2 libasound2 \
            libegl1 libgl1 libopengl0 libgbm1 libnss3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libxshmfence1 \
            libxcb-cursor0 libdbus-1-3 libfontconfig1

      - uses: actions/download-artifact@v4
        if: matrix.edition == 'ai'
        with:
          name: models

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.edition }}" = ai ]; then
            # Linux: the CPU build (PyPI's brings several GB of CUDA libraries)
            if [ "$RUNNER_OS" = Linux ]; then
              pip install torch --index-url https://download.pytorch.org/whl/cpu
            fi
            pip install -e ".[ml]"
          else
            pip install -e .
          fi
          pip install "pyinstaller>=6.10"
          python tools/fetch_fonts.py

      - name: Build
        id: build
        shell: bash
        run: |
          python packaging/build.py --edition ${{ matrix.edition }} | tee build.log
          echo "archive=$(tail -n 1 build.log)" >> "$GITHUB_OUTPUT"

      # The sandbox is off in CI only (Ubuntu's AppArmor user-namespace
      # restriction), never in the shipped app
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: xvfb-run -a python packaging/smoke.py dist/${{ matrix.edition }}
      - name: Smoke test
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/smoke.py dist/${{ matrix.edition }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.edition }}
          path: ${{ steps.build.outputs.archive }}
          compression-level: 0
          retention-days: 7

  publish:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: '*-*'
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Pythonic ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release-notes.md --generate-notes
