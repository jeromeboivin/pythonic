<!doctype html>
<!--
  PROTOTYPE, throwaway. Answers "How is the selected channel's edit rack organised inside?" (map #1, ticket #11).
  The settled face (panel layout, variant A) with three structurally different racks under it, switchable with
  ?variant=A|B|C, the bottom bar, or the left/right arrow keys. In-memory only, no engine.
  Controls follow the settled behaviour: vertical drag (200 px = full range, Shift fine), wheel, fader track
  click jumps, values printed under every control, the touched control shows on the red display.
  LFOs and the pump run a fake modulation so the indicators move; the face's tune / decay / level are the same
  addresses as the rack's pitch / osc decay / level, so they move together.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE edit rack</title>
<style>
  :root {
    --bg: #050506; --panel: #17181a; --panel-hi: #1e1f22; --box: #34363a; --label: #e8e8e4; --dim: #8f9194;
    --accent: #ff8a1f; --knob: #0d0d0e; --lcd-bg: #120706; --lcd: #ff4a30; --mute: #8a3dff; --pad-off: #232427;
    --g1: #e8352a; --g2: #f2862e; --g3: #f4cf3a; --g4: #f3efe3;
    --lfo1: #3cc8ff; --lfo2: #ff5fa8; --pump: #d9e04a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; user-select: none;
    font-family: "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; color: var(--label); }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--panel);
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
    border-radius: 14px; box-shadow: 0 0 0 2px #2a2b2e inset; overflow: hidden; }
  .box { border: 1px solid var(--box); border-radius: 8px; padding: 8px; position: relative; }
  .ttl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); text-align: center; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .wordmark { font-weight: 800; letter-spacing: .32em; font-size: 22px; } .wordmark b { color: var(--accent); }
  .btn { background: #2a2b2f; color: var(--label); border: 0; border-radius: 4px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    padding: 5px 7px; cursor: pointer; box-shadow: 0 2px 0 #0a0a0b; font-family: inherit; min-width: 24px; white-space: nowrap; }
  .btn.on { background: var(--accent); color: #1a0d00; box-shadow: 0 0 10px rgba(255,138,31,.45), 0 2px 0 #6b3405; }
  .btn.mute.on { background: var(--mute); color: #fff; box-shadow: 0 0 10px rgba(138,61,255,.5); }
  .btn.big { width: 64px; height: 64px; border-radius: 50%; font-size: 22px; padding: 0; }
  .btn.big.on { background: #2fd05a; color: #032; box-shadow: 0 0 14px rgba(47,208,90,.5); }
  .led { width: 8px; height: 8px; border-radius: 50%; background: #2a1606; display: inline-block; }
  .led.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .led.g.on { background: #3dff6e; box-shadow: 0 0 6px #3dff6e; }
  .lcd { background: var(--lcd-bg); color: var(--lcd); font-family: "DejaVu Sans Mono", monospace; border-radius: 4px; padding: 6px 10px;
    text-shadow: 0 0 6px rgba(255,74,48,.6); box-shadow: inset 0 0 0 1px #3a1410; letter-spacing: .06em; white-space: nowrap; overflow: hidden; }
  .lcd.seg7 { font-size: 34px; font-weight: 700; letter-spacing: .12em; text-align: right; height: 54px; }
  .lcd.seg7.txt { font-size: 15px; line-height: 20px; letter-spacing: .04em; white-space: normal; text-align: left; }

  /* generic control */
  .ctl { display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; flex: none; }
  .ctl .lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); white-space: nowrap; }
  .ctl .val { font-size: 10px; font-family: "DejaVu Sans Mono", monospace; color: var(--label); white-space: nowrap; min-height: 12px; }
  .ctl .val.off { color: #55575b; }
  .k { cursor: ns-resize; min-width: calc(var(--s) + 14px); }
  .k svg { width: var(--s); height: var(--s); display: block; }
  .vf, .hf { cursor: ns-resize; }
  .vf .track { width: 7px; height: var(--fh, 100px); background: #050505; border-radius: 3px; position: relative; box-shadow: 0 0 0 1px #2c2d30; margin: 2px 10px 3px; }
  .vf .track i { position: absolute; left: 50%; width: 24px; height: 12px; margin-left: -12px; background: linear-gradient(#55575c, #2b2c30); border-radius: 2px; box-shadow: 0 1px 0 #000; pointer-events: none; }
  .vf .track i::after { content: ""; position: absolute; left: 3px; right: 3px; top: 5px; height: 2px; background: var(--accent); }
  .vf .track .mg { position: absolute; left: -7px; right: -7px; height: 2px; display: none; pointer-events: none; }
  .hf .track { height: 7px; width: var(--fw, 110px); background: #050505; border-radius: 3px; position: relative; box-shadow: 0 0 0 1px #2c2d30; margin: 9px 6px 6px; }
  .hf .track i { position: absolute; top: 50%; width: 12px; height: 22px; margin-top: -11px; margin-left: -6px; background: linear-gradient(90deg, #55575c, #2b2c30); border-radius: 2px; pointer-events: none; }
  .hf .track i::after { content: ""; position: absolute; top: 3px; bottom: 3px; left: 5px; width: 2px; background: var(--accent); }
  .hf .track .mg { position: absolute; top: -7px; bottom: -7px; width: 2px; display: none; pointer-events: none; }
  .hf .ends { display: flex; justify-content: space-between; width: var(--fw, 110px); font-size: 9px; color: var(--dim); text-transform: uppercase; }
  .seg .opts { display: flex; gap: 2px; }
  .seg .btn { padding: 4px 5px; font-size: 9px; min-width: 0; }
  .tg .btn { padding: 4px 7px; font-size: 9px; }
  .list .lbox { background: #0b0b0c; border: 1px solid #2f3034; border-radius: 3px; font-size: 10px; padding: 3px 18px 3px 6px; min-width: var(--lw, 62px);
    text-align: left; cursor: pointer; position: relative; white-space: nowrap; }
  .list .lbox::after { content: "▾"; position: absolute; right: 5px; color: var(--dim); }
  .chips { display: flex; gap: 2px; min-height: 0; }
  .chips b { font-size: 8px; padding: 0 3px; border-radius: 2px; color: #000; font-weight: 700; }
  .tgt { outline: 1px dashed var(--src); outline-offset: 2px; border-radius: 5px; cursor: crosshair !important; }
  .tgt * { cursor: crosshair !important; }

  /* pads, strips, patterns */
  .pads { display: grid; grid-template-columns: repeat(16, 1fr); gap: 8px; }
  .pad { height: 70px; border-radius: 6px; position: relative; background: var(--pad-off); box-shadow: inset 0 -3px 0 rgba(0,0,0,.35), 0 2px 0 #000; }
  .pad::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; border-radius: 6px 6px 0 0; background: var(--gc); opacity: .55; }
  .pad.on { background: var(--gc); box-shadow: 0 0 14px var(--gc), inset 0 -3px 0 rgba(0,0,0,.25); }
  .pad.ph { outline: 2px solid #3dff6e; outline-offset: 2px; }
  .strips { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; flex: 1; }
  .strip { border: 1px solid var(--box); border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 4px 8px; }
  .strip.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, 0 0 18px rgba(255,138,31,.15); }
  .strip.all { border-color: #b8661e; border-style: dashed; }
  .strip .hd { width: 100%; background: var(--panel-hi); border-radius: 4px; padding: 4px 3px; text-align: center; cursor: pointer; }
  .strip .hd .n { font-size: 10px; color: var(--accent); font-weight: 700; }
  .strip .hd .nm { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .grow { flex: 1; display: flex; align-items: flex-end; }
  .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .pbtn { font-size: 12px; font-weight: 700; padding: 7px 0; }
  .pbtn.play { background: #2fd05a; color: #032; }
  .pbtn.empty { color: #55575b; }
  .prog { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; } .prog .btn { padding: 4px 0; font-size: 9px; }

  /* rack */
  .rack { display: flex; flex-direction: column; height: 100%; }
  .rack .hdr { display: flex; align-items: center; gap: 10px; height: 26px; margin-bottom: 6px; }
  .rack .hdr .ch { color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: .1em; }
  .rack .hdr .nm { font-size: 13px; }
  .rack .hdr .ty { font-size: 10px; color: var(--dim); }
  .rack .hdr .sp { flex: 1; }
  .rack .hdr .ea { font-size: 10px; color: var(--accent); letter-spacing: .06em; }
  .secs { display: flex; gap: 6px; flex: 1; min-height: 0; }
  .sec { border: 1px solid var(--box); border-radius: 8px; padding: 5px 7px 6px; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .sec h4 { margin: 0; font-size: 10px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); display: flex; gap: 6px; align-items: center; }
  .sec h4 .sw { width: 9px; height: 9px; border-radius: 2px; }
  .sec .r { display: flex; gap: 4px 6px; align-items: flex-end; justify-content: space-around; }
  .sec.off .r > :not(.tg) { opacity: .45; }
  .tabs .btn { padding: 5px 14px; position: relative; }
  .tabs .btn .dot { position: absolute; top: 3px; right: 4px; width: 6px; height: 6px; border-radius: 50%; }
  .modrow { display: flex; align-items: flex-end; gap: 5px; border-top: 1px solid #26272a; padding-top: 4px; }
  .modrow:first-of-type { border-top: 0; padding-top: 0; }
  .modrow .nm { width: 40px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; align-self: center; font-weight: 700; }
  .asg .btn { min-width: 86px; text-align: left; text-transform: none; font-size: 10px; letter-spacing: 0; }
  .asg .btn.armed { color: #000; }
  .abar { font-size: 11px; display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-radius: 4px; color: #000; }

  #pop { position: absolute; z-index: 20; background: #0e0e10; border: 1px solid #3a3c40; border-radius: 6px; padding: 4px; display: none; box-shadow: 0 8px 30px rgba(0,0,0,.7); }
  #pop .it { padding: 4px 10px; font-size: 11px; cursor: pointer; border-radius: 3px; white-space: nowrap; }
  #pop .it:hover { background: #2a2b2f; } #pop .it.cur { color: var(--accent); }
  #pop .grp { display: flex; gap: 6px; }
  #pop .gcol h5 { margin: 4px 10px 2px; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 400; }

  #switcher { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 99; display: flex; align-items: center; gap: 10px;
    background: #fff; color: #111; border-radius: 999px; padding: 6px 10px; font: 13px/1.2 system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.6); max-width: 96vw; }
  #switcher button { border: 0; background: #111; color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px; flex: none; }
  #switcher small { color: #666; margin-left: 4px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="switcher"><button id="prev" title="previous (←)">◀</button><span id="vlabel"></span><button id="next" title="next (→)">▶</button></div>
<script>
// ---------------------------------------------------------------- parameters (engine units)
const P = {};
const def = (id, s) => { P[id] = { id, ...s }; };
const HZ = { u: 'Hz', log: true }, MS = { u: 'ms', log: true }, PC = { u: '%' };
def('osc.wave', { t: 'seg', l: 'wave', n: 'osc wave', o: ['sin', 'tri', 'saw'], d: 0 });
def('osc.freq', { t: 'k', l: 'freq', n: 'osc freq', min: 20, max: 20000, d: 440, ...HZ });
def('osc.pitch', { t: 'k', l: 'pitch', n: 'pitch', min: -24, max: 24, d: 0, u: 'st', bi: 1 });
def('osc.pmode', { t: 'seg', l: 'pitch mod', n: 'pitch mod', o: ['dec', 'sine', 'rand'], d: 0 });
def('osc.amt', { t: 'k', l: 'amount', n: 'pitch mod amount', min: -120, max: 120, d: 0, u: 'st', bi: 1 });
def('osc.rate', { t: 'k', l: 'rate', n: 'pitch mod rate', min: 1, max: 2000, d: 100, ...HZ });
def('osc.atk', { t: 'k', l: 'attack', n: 'osc attack', min: 0, max: 10000, d: 0, ...MS });
def('osc.dec', { t: 'k', l: 'decay', n: 'osc decay', min: 10, max: 10000, d: 316, ...MS });
def('noise.filt', { t: 'seg', l: 'filter', n: 'noise filter', o: ['LP', 'BP', 'HP'], d: 0 });
def('noise.freq', { t: 'k', l: 'freq', n: 'noise freq', min: 20, max: 20000, d: 20000, ...HZ });
def('noise.q', { t: 'k', l: 'Q', n: 'noise Q', min: .5, max: 20, d: .707, u: 'q', log: true });
def('noise.stereo', { t: 'tg', l: 'stereo', n: 'noise stereo', d: 0 });
def('noise.env', { t: 'seg', l: 'env', n: 'noise envelope', o: ['exp', 'lin', 'mod'], d: 0 });
def('noise.atk', { t: 'k', l: 'attack', n: 'noise attack', min: 0, max: 10000, d: 0, ...MS });
def('noise.dec', { t: 'k', l: 'decay', n: 'noise decay', min: 10, max: 10000, d: 316, ...MS });
def('mix.mix', { t: 'hf', l: 'osc · noise', n: 'osc/noise mix', min: 0, max: 100, d: 50, u: 'mix' });
def('mix.eqf', { t: 'k', l: 'eq freq', n: 'eq freq', min: 20, max: 20000, d: 632, ...HZ });
def('mix.eqg', { t: 'k', l: 'eq gain', n: 'eq gain', min: -40, max: 40, d: 0, u: 'dB', bi: 1 });
def('mix.dist', { t: 'k', l: 'distort', n: 'distortion', min: 0, max: 100, d: 0, ...PC });
def('mix.level', { t: 'k', l: 'level', n: 'level', min: -60, max: 10, d: 0, u: 'dB' });
def('mix.pan', { t: 'k', l: 'pan', n: 'pan', min: -100, max: 100, d: 0, u: 'pan', bi: 1 });
def('mix.choke', { t: 'tg', l: 'choke', n: 'choke', d: 0 });
def('mix.out', { t: 'seg', l: 'out', n: 'output', o: ['A', 'B'], d: 0 });
def('fx.vint', { t: 'k', l: 'vintage', n: 'vintage', min: 0, max: 100, d: 0, ...PC });
def('fx.rt', { t: 'k', l: 'rvb time', n: 'reverb time', min: 0, max: 100, d: 0, ...PC });
def('fx.rm', { t: 'k', l: 'rvb mix', n: 'reverb mix', min: 0, max: 100, d: 0, ...PC });
def('fx.rw', { t: 'k', l: 'rvb wide', n: 'reverb width', min: 0, max: 200, d: 100, ...PC });
def('fx.dt', { t: 'seg', l: 'delay', n: 'delay time', o: ['1/4', '1/8', '1/16', '1/8T', '1/4.'], d: 1 });
def('fx.fb', { t: 'k', l: 'dly fdbk', n: 'delay feedback', min: 0, max: 95, d: 30, ...PC });
def('fx.dm', { t: 'k', l: 'dly mix', n: 'delay mix', min: 0, max: 100, d: 0, ...PC });
def('fx.pp', { t: 'tg', l: 'P.P', n: 'ping-pong', d: 0 });
for (const v of ['osc', 'noise', 'mod']) def('vel.' + v, { t: 'vf', l: v, n: v + ' velocity', min: 0, max: 200, d: 0, ...PC });
const WAVES = ['Sin', 'Tri', 'Saw▲', 'Saw▼', 'Sq', 'S&H'];
const SYNCS = ['Free', '1/1', '1/2', '1/4', '1/8', '1/16', '1/4.', '1/8.', '1/4T', '1/8T', '2bar', '4bar'];
for (const s of ['lfo1', 'lfo2']) {
  const N = s === 'lfo1' ? 'LFO 1 ' : 'LFO 2 ';
  def(s + '.on', { t: 'tg', l: 'on', n: N + 'on', d: 0 });
  def(s + '.wave', { t: 'list', l: 'wave', n: N + 'wave', o: WAVES, d: 0 });
  def(s + '.rate', { t: 'k', l: 'rate', n: N + 'rate', min: .01, max: 50, d: 1, ...HZ });
  def(s + '.depth', { t: 'k', l: 'depth', n: N + 'depth', min: 0, max: 100, d: 0, u: '' });
  def(s + '.sync', { t: 'list', l: 'sync', n: N + 'sync', o: SYNCS, d: 0 });
  def(s + '.re', { t: 'tg', l: 're', n: N + 'retrigger', d: 1 });
  def(s + '.uni', { t: 'tg', l: 'uni', n: N + 'unipolar', d: 0 });
  def(s + '.dest', { t: 'dest', l: 'dest', n: N + 'destination', d: 0 });
}
def('pump.on', { t: 'tg', l: 'on', n: 'pump on', d: 0 });
def('pump.amt', { t: 'k', l: 'amount', n: 'pump amount', min: 0, max: 100, d: 0, ...PC });
def('pump.atk', { t: 'k', l: 'attack', n: 'pump attack', min: .1, max: 100, d: 1, ...MS });
def('pump.rel', { t: 'k', l: 'release', n: 'pump release', min: 1, max: 1000, d: 100, ...MS });
def('pump.curve', { t: 'k', l: 'curve', n: 'pump curve', min: 0, max: 100, d: 50, ...PC });
def('pump.dest', { t: 'dest', l: 'dest', n: 'pump destination', d: 0 });
def('g.master', { t: 'k', l: 'master', n: 'master volume', min: 0, max: 100, d: 70, ...PC });
def('g.morph', { t: 'k', l: 'sound morph', n: 'sound morph', min: 0, max: 100, d: 35, ...PC });

// destination list: Off + 27 targets in 7 groups (labels as the engine names them)
const DEST = [{ l: 'Off' }];
[['Oscillator', [['Osc Freq', 'osc.freq'], ['Pitch', 'osc.pitch'], ['Pitch Mod Amt', 'osc.amt'], ['Pitch Mod Rate', 'osc.rate'], ['Osc Attack', 'osc.atk'], ['Osc Decay', 'osc.dec']]],
 ['Noise', [['Noise Freq', 'noise.freq'], ['Noise Q', 'noise.q'], ['Noise Attack', 'noise.atk'], ['Noise Decay', 'noise.dec']]],
 ['Mix', [['Osc/Noise Mix', 'mix.mix'], ['Level', 'mix.level'], ['Pan', 'mix.pan'], ['Distortion', 'mix.dist']]],
 ['EQ', [['EQ Freq', 'mix.eqf'], ['EQ Gain', 'mix.eqg']]],
 ['FX', [['Vintage', 'fx.vint'], ['Reverb Time', 'fx.rt'], ['Reverb Mix', 'fx.rm'], ['Reverb Width', 'fx.rw'], ['Delay Feedback', 'fx.fb'], ['Delay Mix', 'fx.dm']]],
 ['Velocity', [['Osc Vel', 'vel.osc'], ['Noise Vel', 'vel.noise'], ['Mod Vel', 'vel.mod']]],
 ['Global', [['Master Vol', 'g.master'], ['Morph', 'g.morph']]]].forEach(([g, xs]) => xs.forEach(([l, id]) => { DEST.push({ g, l, id }); P[id].mod = 1; }));
const destIx = (id) => DEST.findIndex((d) => d.id === id);
const SRC = { lfo1: { c: 'var(--lfo1)', hex: '#3cc8ff', s: 'L1', n: 'LFO 1' }, lfo2: { c: 'var(--lfo2)', hex: '#ff5fa8', s: 'L2', n: 'LFO 2' }, pump: { c: 'var(--pump)', hex: '#d9e04a', s: 'P', n: 'Pump' } };

// ---------------------------------------------------------------- mock state
const CH = [
  ['Kick Deep', 'BD', { 'osc.freq': 52, 'osc.amt': 38, 'osc.rate': 60, 'osc.dec': 420, 'mix.mix': 92, 'noise.dec': 30, 'lfo1.on': 1, 'lfo1.wave': 1, 'lfo1.rate': .4, 'lfo1.depth': 45, 'lfo1.dest': destIx('osc.dec') }],
  ['Snare Tight', 'SD', { 'osc.freq': 190, 'osc.dec': 120, 'noise.filt': 1, 'noise.freq': 4200, 'noise.dec': 210, 'mix.mix': 35, 'fx.rm': 22, 'fx.rt': 40, 'pump.on': 1, 'pump.amt': 70, 'pump.rel': 300, 'pump.dest': destIx('fx.rm') }],
  ['Closed Hat', 'CH', { 'osc.freq': 8000, 'noise.filt': 2, 'noise.freq': 7000, 'noise.dec': 45, 'mix.mix': 8, 'mix.pan': 18, 'lfo1.on': 1, 'lfo1.wave': 5, 'lfo1.rate': 4, 'lfo1.depth': 30, 'lfo1.dest': destIx('noise.freq') }],
  ['Open Hat', 'OH', { 'noise.filt': 2, 'noise.freq': 6500, 'noise.dec': 380, 'mix.mix': 6, 'mix.choke': 1, 'lfo2.on': 1, 'lfo2.rate': .25, 'lfo2.depth': 80, 'lfo2.dest': destIx('mix.pan') }],
  ['Clap Room', 'CP', { 'noise.filt': 1, 'noise.freq': 1400, 'noise.env': 2, 'noise.dec': 260, 'mix.mix': 4, 'fx.rm': 35, 'fx.rt': 55 }],
  ['Low Tom', 'LT', { 'osc.freq': 110, 'osc.amt': 12, 'osc.dec': 380, 'mix.mix': 85, 'mix.pan': -25 }],
  ['Rim Click', 'RS', { 'osc.freq': 1700, 'osc.wave': 1, 'osc.dec': 25, 'mix.mix': 70, 'fx.dm': 28, 'fx.dt': 3, 'fx.pp': 1 }],
  ['Crash Wash', 'CY', { 'noise.filt': 2, 'noise.freq': 5200, 'noise.dec': 1900, 'noise.stereo': 1, 'mix.mix': 3, 'fx.rm': 30, 'fx.rt': 70, 'mix.level': -4 }],
];
const STEPS = [[0, 4, 8, 10, 12], [4, 12], [0, 2, 4, 6, 8, 10, 12, 14], [2, 6, 10, 14], [4, 12, 15], [7, 13], [3, 11], [0]];
const state = {
  sel: 0, rack: true, editAll: false, page: 0, assign: null, ph: 0, playing: true, mutes: new Set([5]),
  ch: CH.map(([, , o]) => { const v = {}; for (const id in P) if (!id.startsWith('g.')) v[id] = P[id].d; return Object.assign(v, o); }),
  g: { 'g.master': 70, 'g.morph': 35 },
  lastTrig: Array(8).fill(-1e9),
};
const get = (c, id) => c === 'g' ? state.g[id] : state.ch[c][id];

// ---------------------------------------------------------------- units
const lo = (p) => p.min > 0 ? p.min : (p.u === 'ms' ? .1 : 1);
function norm(p, v) {
  if (!p.log) return (v - p.min) / (p.max - p.min);
  if (v <= lo(p)) return 0; return Math.log(v / lo(p)) / Math.log(p.max / lo(p));
}
function denorm(p, n) {
  n = Math.min(1, Math.max(0, n));

    case 'ms': return v >= 1000 ? (v / 1000).toFixed(2) + ' s' : (v < 10 ? v.toFixed(1) : v.toFixed(0)) + ' ms';
    case 'st': return (v > 0 ? '+' : '') + v.toFixed(1) + ' st';
    case 'dB': return (v > 0 ? '+' : '') + v.toFixed(1) + ' dB';
    case '%': return v.toFixed(0) + ' %';

    case 'pan': return Math.abs(v) < .5 ? 'C' : (v < 0 ? 'L' : 'R') + Math.abs(v).toFixed(0);

// ---------------------------------------------------------------- control rendering
function pt(cx, cy, r, a) { const t = a * Math.PI / 180; return [cx + r * Math.sin(t), cy - r * Math.cos(t)]; }

    return `<div class="ctl k ${tgt}" ${da} style="--s:${o.s || cfg().ks}px"><svg viewBox="0 0 100 100">
      <path d="${arc(44, -135, 135)}" stroke="#2c2d31" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="${arc(44, a0, a)}" stroke="var(--accent)" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path class="mo" d="" stroke-width="7" fill="none" stroke-linecap="round" opacity=".95"/>
      <circle cx="50" cy="50" r="34" fill="var(--knob)" stroke="#2a2b2e" stroke-width="2"/>
      <line x1="50" y1="50" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round"/>

// ---------------------------------------------------------------- render + fit
const keys = Object.keys(VARIANTS);
let cur = new URLSearchParams(location.search).get('variant'); if (!keys.includes(cur)) cur = 'A';
const cfg = () => VARIANTS[cur];
const stage = document.getElementById('stage');
const W = 1600, H = () => state.rack ? 1000 : 700;
function render() {
  stage.style.width = W + 'px'; stage.style.height = H() + 'px';
  stage.innerHTML = `<div style="position:absolute;inset:16px;display:grid;grid-template-columns:230px 1fr 270px;grid-template-rows:520px 130px ${state.rack ? '1fr' : '0'};gap:12px">
    ${face()}${state.rack ? `<div class="box" style="grid-column:1/4;grid-row:3;min-height:0"><div class="rack">${cfg().rack()}</div></div>` : ''}</div><div id="pop"></div>`;
  fit();
}
let scale = 1;
function fit() {
  const m = 20; scale = Math.min((innerWidth - m * 2) / W, (innerHeight - m * 2 - 50) / H());
  stage.style.transform = `translate(${(innerWidth - W * scale) / 2}px, ${(innerHeight - 50 - H() * scale) / 2}px) scale(${scale})`;
  document.getElementById('vlabel').innerHTML = `<b>${cur}</b> · ${cfg().name}<small>scale ${scale.toFixed(2)}</small>`;
  document.getElementById('vlabel').title = cfg().note;
}
function go(d) { cur = keys[(keys.indexOf(cur) + d + keys.length) % keys.length]; state.assign = null; try { history.replaceState(null, '', '?variant=' + cur); } catch (_) {} render(); }
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('resize', fit);
addEventListener('keydown', (e) => {

// ---------------------------------------------------------------- editing
let lcdTimer;
function show(c, id) {
  const p = P[id], el = document.getElementById('lcd'); if (!el) return;
  el.classList.add('txt'); el.textContent = `${c === 'g' ? '' : 'CH' + (c + 1) + ' '}${p.n.toUpperCase()} ${valText(p, get(c, id))}`;
  clearTimeout(lcdTimer); lcdTimer = setTimeout(() => { el.classList.remove('txt'); el.textContent = '120.0'; }, 1500);
}
function set(c, id, v, rerender) {
  const p = P[id];
  if (p.t === 'k' || p.t === 'vf' || p.t === 'hf') v = Math.min(p.max, Math.max(p.min, v));
  if (c === 'g') state.g[id] = v;
  else (state.editAll ? state.ch.map((_, i) => i) : [c]).forEach((i) => { state.ch[i][id] = v; });
  if (rerender) render(); else refresh(id);
  show(c, id);
}
let drag = null;
stage.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('[data-k]'); if (!el || e.button !== 0) return;
  const id = el.dataset.k, c = el.dataset.c === 'g' ? 'g' : +el.dataset.c, t = el.dataset.t, p = P[id];
  if (state.assign && el.classList.contains('tgt')) { set(state.sel, state.assign + '.dest', destIx(id), false); state.assign = null; render(); e.preventDefault(); return; }
  if (!['k', 'vf', 'hf'].includes(t)) return;
  e.preventDefault();
  let n = norm(p, get(c, id));
  const tr = el.querySelector('.track');
  if (tr && e.target === tr) {  // track click jumps
    const r = tr.getBoundingClientRect();
    n = t === 'vf' ? 1 - (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
    set(c, id, denorm(p, n));
  }
  drag = { id, c, t, n, x: e.clientX, y: e.clientY, len: t === 'k' ? 200 : (tr ? (t === 'vf' ? tr.offsetHeight : tr.offsetWidth) : 200) };
});
addEventListener('pointermove', (e) => {
  if (!drag) return;
  const d = drag.t === 'hf' ? (e.clientX - drag.x) : -(e.clientY - drag.y);
  const f = e.shiftKey ? .1 : 1;
  drag.n = Math.min(1, Math.max(0, drag.n + d / scale / drag.len * f)); drag.x = e.clientX; drag.y = e.clientY;
  set(drag.c, drag.id, denorm(P[drag.id], drag.n));
});
addEventListener('pointerup', () => { drag = null; });
stage.addEventListener('wheel', (e) => {
  const el = e.target.closest('[data-k]'); if (!el) return; e.preventDefault();
  const id = el.dataset.k, c = el.dataset.c === 'g' ? 'g' : +el.dataset.c, t = el.dataset.t, p = P[id], dir = e.deltaY < 0 ? 1 : -1;
  if (t === 'k' || t === 'vf' || t === 'hf') set(c, id, denorm(p, norm(p, get(c, id)) + dir * (t === 'k' ? .01 : .02)));
  else if (t === 'seg' || t === 'list') set(c, id, Math.min(p.o.length - 1, Math.max(0, get(c, id) + dir)));
  else if (t === 'dest' || t === 'asg') set(c, id, Math.min(DEST.length - 1, Math.max(0, get(c, id) - dir)));
}, { passive: false });

const pop = () => document.getElementById('pop');
function openPop(anchor, html) {
  const sr = stage.getBoundingClientRect(), r = anchor.getBoundingClientRect(), el = pop();
  el.innerHTML = html; el.style.display = 'block';
  let x = (r.left - sr.left) / scale, y = (r.bottom - sr.top) / scale + 4;
  const w = el.offsetWidth, h = el.offsetHeight;
  if (x + w > W - 8) x = W - 8 - w; if (y + h > H() - 8) y = (r.top - sr.top) / scale - h - 4;

let popFor = null;
stage.addEventListener('click', (e) => {
  const it = e.target.closest('#pop .it');
  if (it) { if (popFor) set(popFor.c, popFor.id, +it.dataset.v, popFor.id.endsWith('.on')); pop().style.display = 'none'; popFor = null; return; }
  if (!e.target.closest('#pop')) { pop().style.display = 'none'; popFor = null; }
  const t = e.target;
  const el = t.closest('[data-k]');
  if (el) {
    const id = el.dataset.k, c = el.dataset.c === 'g' ? 'g' : +el.dataset.c, ty = el.dataset.t, p = P[id];
    if (ty === 'seg' && t.dataset.o) set(c, id, +t.dataset.o);
    else if (ty === 'tg' && t.closest('.btn')) set(c, id, get(c, id) ? 0 : 1, id.endsWith('.on'));
    else if (ty === 'list' && t.closest('.lbox')) { popFor = { c, id }; openPop(t.closest('.lbox'), p.o.map((o, i) => `<div class="it ${i === get(c, id) ? 'cur' : ''}" data-v="${i}">${o}</div>`).join('')); }
    else if (ty === 'dest' && t.closest('.lbox')) {
      popFor = { c, id }; const v = get(c, id), groups = {};
      DEST.forEach((d, i) => { (groups[d.g || ''] ||= []).push(`<div class="it ${i === v ? 'cur' : ''}" data-v="${i}">${d.l}</div>`); });
      openPop(t.closest('.lbox'), `<div class="grp">${Object.entries(groups).map(([g, xs]) => `<div class="gcol"><h5>${g || '&nbsp;'}</h5>${xs.join('')}</div>`).join('')}</div>`);
    } else if (ty === 'asg') { const s = id.split('.')[0]; state.assign = state.assign === s ? null : s; render(); }
    return;
  }
  const a = t.closest('[data-selch],[data-mute],[data-rack],[data-play],[data-editall],[data-page],[data-patchmenu],[data-asgoff],[data-asgcancel]');
  if (!a) return; const d = a.dataset;
  if (d.selch) { state.sel = +d.selch; state.assign = null; }
  else if (d.mute) { const i = +d.mute; state.mutes.has(i) ? state.mutes.delete(i) : state.mutes.add(i); }
  else if (d.rack !== undefined) state.rack = !state.rack;
  else if (d.play !== undefined) state.playing = !state.playing;
  else if (d.editall !== undefined) state.editAll = !state.editAll;
  else if (d.page) state.page = +d.page;
  else if (d.asgoff !== undefined) { set(state.sel, state.assign + '.dest', 0); state.assign = null; }
  else if (d.asgcancel !== undefined) state.assign = null;
  else if (d.patchmenu !== undefined) { popFor = null; openPop(a, ['Load drum patch (.mtdrum)…', 'Save drum patch (.mtdrum)…'].map((x) => `<div class="it">${x}</div>`).join('')); return; }
  render();
});

// ---------------------------------------------------------------- fake modulation + playhead
function wave(w, p) {
  const f = p - Math.floor(p);
  return [Math.sin(2 * Math.PI * p), 1 - 4 * Math.abs(f - .5), 2 * f - 1, 1 - 2 * f, f < .5 ? 1 : -1, Math.sin(Math.floor(p) * 12.9898) * 43758.5453 % 1 * 2][w];
}
function mods(now) {
  const out = {};
  state.ch.forEach((v, c) => {
    for (const s of ['lfo1', 'lfo2', 'pump']) {
      if (!v[s + '.on'] || !v[s + '.dest']) continue;
      const tgt = DEST[v[s + '.dest']].id; let off;
      if (s === 'pump') {
        const dt = now - state.lastTrig[c], a = v['pump.atk'], r = v['pump.rel'];
        const duck = dt < a ? dt / a : Math.max(0, 1 - (dt - a) / r);
        off = -v['pump.amt'] / 100 * .5 * Math.pow(duck, .3 + v['pump.curve'] / 50);
      } else {
        let w = wave(v[s + '.wave'], now / 1000 * v[s + '.rate']); if (v[s + '.uni']) w = (w + 1) / 2;
        off = w * v[s + '.depth'] / 100 * .5;
      }
      const key = (tgt.startsWith('g.') ? 'g' : c) + ':' + tgt;
      (out[key] ||= { off: 0, src: [] }).off += off; out[key].src.push(s);
    }
  });
  return out;
}
function frame(now) {
  const M = mods(now), ind = cfg().ind;
  stage.querySelectorAll('.k[data-k], .vf[data-k], .hf[data-k]').forEach((el) => {
    const id = el.dataset.k, m = M[el.dataset.c + ':' + id], p = P[id];
    const n = norm(p, get(el.dataset.c === 'g' ? 'g' : +el.dataset.c, id));
    const col = m ? SRC[m.src[0]].hex : '';
    const nn = m ? Math.min(1, Math.max(0, n + m.off)) : n;
    if (el.classList.contains('k')) {
      const mo = el.querySelector('.mo'), mp = el.querySelector('.mp');
      if (!m) { mo.setAttribute('d', ''); mp.setAttribute('opacity', 0); }
      else if (ind === 'pointer') {
        mo.setAttribute('d', ''); const [x, y] = pt(50, 50, 33, ang(nn));
        mp.setAttribute('x1', x.toFixed(1)); mp.setAttribute('y1', y.toFixed(1)); const [x2, y2] = pt(50, 50, 46, ang(nn));
        mp.setAttribute('x2', x2.toFixed(1)); mp.setAttribute('y2', y2.toFixed(1)); mp.setAttribute('stroke', '#fff'); mp.setAttribute('opacity', .9);
      } else { mo.setAttribute('d', arc(44, ang(n), ang(nn))); mo.setAttribute('stroke', col); mp.setAttribute('opacity', 0); }
    } else {
      const g = el.querySelector('.mg');
      if (!m) g.style.display = 'none';
      else { g.style.display = 'block'; g.style.background = ind === 'pointer' ? '#fff' : col; g.style.boxShadow = `0 0 4px ${ind === 'pointer' ? '#fff' : col}`;
        if (el.classList.contains('vf')) g.style.top = `calc(${(1 - nn) * 100}% - 1px)`; else g.style.left = `calc(${nn * 100}% - 1px)`; }
    }
    const ch = el.querySelector('.chips');
    if (ch) { const h = m ? m.src.map((s) => `<b style="background:${SRC[s].hex}">${SRC[s].s}</b>`).join('') : ''; if (ch.innerHTML !== h) ch.innerHTML = h; }
  });
  if (cur === 'B') {  // page dots: modulation running on the hidden page
    const pageOf = (id) => /^(fx|lfo|pump)/.test(id) ? 1 : 0, dots = [false, false], v = state.ch[state.sel];
    for (const k in M) if (k.startsWith(state.sel + ':')) dots[pageOf(k.split(':')[1])] = true;
    for (const s of ['lfo1', 'lfo2', 'pump']) if (v[s + '.on'] && v[s + '.dest']) dots[1] = true;
    stage.querySelectorAll('[data-pagedot]').forEach((d) => { const i = +d.dataset.pagedot; d.style.background = dots[i] && i !== state.page ? 'var(--lfo1)' : 'transparent'; });
  }
  requestAnimationFrame(frame);
}
setInterval(() => {
  if (!state.playing) return;
  state.ph = (state.ph + 1) % 16; const now = performance.now();
  STEPS.forEach((s, c) => { if (s.includes(state.ph)) state.lastTrig[c] = now; });
  stage.querySelectorAll('.pad').forEach((p, i) => p.classList.toggle('ph', i === state.ph));
  stage.querySelectorAll('[data-trig]').forEach((l) => l.classList.toggle('on', STEPS[+l.dataset.trig].includes(state.ph)));
}, 125);
render();
requestAnimationFrame(frame);
</script>
