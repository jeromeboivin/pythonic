<!doctype html>
<html><body style="font:14px sans-serif">
<input id="in1" type="file" accept=".json,.mtpreset">
<input id="in2" type="file" multiple accept="audio/wav,.wav"><br>
<input id="in3" type="file" webkitdirectory><br>
<button id="fsOpen">showOpenFilePicker</button>
<button id="fsSave">showSaveFilePicker</button>
<button id="fsDir">showDirectoryPicker</button>
<script>
const R = (o) => console.log('RESULT ' + JSON.stringify(o));
function centre(id) {
  const r = document.getElementById(id).getBoundingClientRect();
  return [r.left + r.width / 2, r.top + r.height / 2];
}
function describe(files) {
  return [...files].map(f => ({name: f.name, size: f.size, type: f.type,
    rel: f.webkitRelativePath, hasPath: 'path' in f}));
}
for (const id of ['in1', 'in2', 'in3']) {
  document.getElementById(id).addEventListener('change', e =>
    R({src: id, files: describe(e.target.files)}));
}
const presetTypes = [{description: 'Preset', accept: {'application/json': ['.json', '.mtpreset']}}];
fsOpen.onclick = async () => {
  try {
    const [h] = await showOpenFilePicker({types: presetTypes, startIn: 'documents'});
    const f = await h.getFile();
    R({src: 'fsOpen', name: h.name, text: await f.text()});
  } catch (e) { R({src: 'fsOpen', error: String(e)}); }
};
fsSave.onclick = async () => {
  try {
    const h = await showSaveFilePicker({suggestedName: 'my kit.mtpreset', types: presetTypes});
    const w = await h.createWritable();
    await w.write('{"saved": true}');
    await w.close();
    R({src: 'fsSave', name: h.name});
  } catch (e) { R({src: 'fsSave', error: String(e)}); }
};
fsDir.onclick = async () => {
  try {
    const d = await showDirectoryPicker({mode: 'readwrite'});
    const names = [];
    for await (const [n] of d.entries()) names.push(n);
    const fh = await d.getFileHandle('new.mtdrum', {create: true});
    const w = await fh.createWritable(); await w.write('x'); await w.close();
    R({src: 'fsDir', name: d.name, entries: names});
  } catch (e) { R({src: 'fsDir', error: String(e)}); }
};
async function probeEnv() {
  const env = {secure: isSecureContext, ua: navigator.userAgent,
    hasOpen: 'showOpenFilePicker' in window, hasSave: 'showSaveFilePicker' in window,
    hasDir: 'showDirectoryPicker' in window, hasMidi: 'requestMIDIAccess' in navigator,
    hasMediaDevices: !!navigator.mediaDevices};
  try {
    const d = await navigator.mediaDevices.enumerateDevices();
    env.devices = d.map(x => ({kind: x.kind, label: x.label, id: x.deviceId ? 'set' : ''}));
  } catch (e) { env.devicesError = String(e); }
  if (env.hasMidi) {
    try {
      const m = await Promise.race([navigator.requestMIDIAccess(),
        new Promise((_, rej) => setTimeout(() => rej('timeout'), 3000))]);
      env.midiOut = [...m.outputs.values()].map(o => o.name);
    } catch (e) { env.midiError = String(e); }
  }
  return env;
}
</script>
</body></html>
